# Re-export derived assets when a model, scene or the renderer changes.
# Free: GitHub-hosted runner (public repo), CPU rendering (SwiftShader), no secrets needed.
name: render
on:
  push:
    branches: [main]
    paths: ['models/**', 'scenes/**', 'render/**', 'pipeline.json', 'package-lock.json']
  pull_request:
    paths: ['models/**', 'scenes/**', 'render/**', 'pipeline.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Render stale outputs
        run: npm run render:changed
      - name: Outputs must be fresh
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ github.sha }}
          path: out/
          retention-days: 14
      # On main, commit refreshed outputs back (SPEC D3). Publishing to consumer repos is D4.
      - if: github.event_name == 'push'
        run: |
          git config user.name "arffornia-assets[bot]"; git config user.email "actions@users.noreply.github.com"
          git add out/ && git diff --cached --quiet || { git commit -m "chore(out): re-render derived assets"; git push; }
