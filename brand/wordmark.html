<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Arffornia wordmark</title>
<link rel="stylesheet" href="../ui/fonts/fonts.css">
<style>
  /* Logo lockup for in-game overlays (FancyMenu/Drippy loading screen): crafting table + wordmark,
     transparent, 1920x459 (the slot the old logo used). */

  .lock { width: 1920px; height: 459px; display: flex; align-items: center; justify-content: center; gap: 56px; }
  img { width: 300px; height: 300px; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, .55)); }
  b { font: 700 250px/1 'Chakra Petch', sans-serif; color: #f4f7f8; letter-spacing: -2px; text-shadow: 0 14px 40px rgba(0, 0, 0, .6); }
</style></head>
<body><div class="lock"><img src="crafting-table.png" alt=""><b>Arffornia</b></div></body></html>
