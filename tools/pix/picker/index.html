<title>Arffornia Concept Picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a workshop pin board. Sticky toolbar, one band per tier, a grid of numbered concept cards. */
:root {
  --bg: #eeecea; --surface: #fbfaf8; --ink: #23201d; --muted: #6d6660; --line: #d9d4ce;
  --orange: #e8631c; --orange-ink: #ffffff;
  --keep: #2f8a4c; --maybe: #b5850f; --no: #9a948d; --img: #e4e2df;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1b1a19; --surface: #262422; --ink: #ece8e3; --muted: #a59d95; --line: #3a3633;
  --orange: #f07a35; --orange-ink: #1b1a19; --keep: #58b674; --maybe: #e0b13b; --no: #77706a; --img: #d9d7d3; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1b1a19; --surface: #262422; --ink: #ece8e3; --muted: #a59d95; --line: #3a3633;
  --orange: #f07a35; --orange-ink: #1b1a19; --keep: #58b674; --maybe: #e0b13b; --no: #77706a; --img: #d9d7d3; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.45 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1400px; margin: 0 auto }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 10px }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; letter-spacing: .02em; margin: 0; text-transform: uppercase }
h1 span { color: var(--orange) }
select, .chip, button { font: inherit }
select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink) }
.filters { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 4px 10px; border-radius: 99px; cursor: pointer; font-size: .85rem; font-variant-numeric: tabular-nums }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.status { margin-left: auto; font-size: .8rem; color: var(--muted) }
.summary { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding-block: 18px 4px; font-size: .9rem }
.summary b { font-family: var(--mono); font-weight: 600 }
.summary .copy { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 4px; padding: 3px 10px; cursor: pointer }
.band { padding-block: 22px 8px }
.band-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 14px }
.band-head .letter { font-family: var(--mono); font-weight: 600; background: var(--orange); color: var(--orange-ink); padding: 0 8px; border-radius: 3px; font-size: 1.1rem }
.band-head h2 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; margin: 0; text-transform: uppercase; letter-spacing: .03em }
.subtier { font-family: var(--mono); font-weight: 600; font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px }
.band-head + .subtier { margin-top: 0 }
.band-head p { margin: 0; color: var(--muted); font-size: .9rem; min-width: 0 }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; min-width: 0 }
.card[data-v="keep"] { border-color: var(--keep); box-shadow: 0 0 0 2px var(--keep) }
.card[data-v="maybe"] { border-color: var(--maybe); box-shadow: 0 0 0 2px var(--maybe) }
.card[data-v="no"] .shot img { opacity: .35; filter: grayscale(1) }
.shot { position: relative; background: var(--img); aspect-ratio: 1; max-width: 100%; border: 0; padding: 0; cursor: zoom-in; display: block; width: 100% }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block }
.ref { position: absolute; top: 8px; left: 8px; font-family: var(--mono); font-weight: 600; font-size: 1.15rem; background: var(--orange); color: var(--orange-ink); padding: 1px 8px; border-radius: 3px; box-shadow: 0 1px 3px rgba(0,0,0,.35) }
.body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1 }
.title { font-weight: 600; margin: 0 }
.tier, .pred { position: absolute; top: 8px; right: 8px; font-family: var(--mono); font-weight: 600; font-size: .8rem; background: var(--ink); color: var(--bg); padding: 2px 6px; border-radius: 3px }
.pred { top: auto; bottom: 8px; left: 8px; right: auto; background: var(--keep); color: #fff }
.mech { color: var(--muted); font-size: .8rem; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden }
.votes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: auto }
.votes button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 4px; padding: 6px 0; cursor: pointer; font-size: .85rem }
.votes button[aria-pressed="true"][data-v="keep"] { background: var(--keep); border-color: var(--keep); color: #fff }
.votes button[aria-pressed="true"][data-v="maybe"] { background: var(--maybe); border-color: var(--maybe); color: #1b1a19 }
.votes button[aria-pressed="true"][data-v="no"] { background: var(--no); border-color: var(--no); color: #fff }
textarea { width: 100%; resize: vertical; min-height: 2.4em; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); font: inherit; font-size: .85rem; padding: 6px 8px }
button:focus-visible, textarea:focus-visible, select:focus-visible, .shot:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px }
.empty { padding: 40px 0; color: var(--muted) }
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(15,14,13,.92); display: grid; grid-template-columns: 1fr minmax(0, 340px); gap: 16px;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.lb img { width: 100%; height: 100%; object-fit: contain; min-height: 0; background: #e4e2df; border-radius: 4px }
.lb aside { background: var(--surface); border-radius: 6px; padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow: auto }
.lb .lbref { font-family: var(--mono); font-weight: 600; font-size: 2rem; color: var(--orange) }
.lb .nav { display: flex; gap: 6px }
.lb .nav button { flex: 1; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 4px; padding: 6px; cursor: pointer }
.keys { font-size: .75rem; color: var(--muted) }
@media (max-width: 760px) { .lb { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto } .lb aside { max-height: 46vh } }
@media (prefers-reduced-motion: no-preference) { .card { transition: box-shadow .15s } }
</style>

<header><div class="wrap">
  <h1>Arffornia <span>Concepts</span></h1>
  <label for="round" hidden>Round</label>
  <select id="round"></select>
  <div class="filters" role="group" aria-label="Filtre">
    <button class="chip" data-f="all" aria-pressed="true">Tout</button>
    <button class="chip" data-f="todo" aria-pressed="false">À voir</button>
    <button class="chip" data-f="keep" aria-pressed="false">Gardés</button>
    <button class="chip" data-f="maybe" aria-pressed="false">Peut-être</button>
  </div>
  <span class="status" id="status">Chargement…</span>
</div></header>

<main class="wrap">
  <div class="summary" id="summary"></div>
  <div id="bands"><p class="empty">Chargement des concepts…</p></div>
</main>

<div class="lb" id="lb" hidden>
  <img id="lbimg" alt="">
  <aside>
    <div class="lbref" id="lbref"></div>
    <p class="title" id="lbtitle"></p>
    <p class="mech" id="lbmech" style="-webkit-line-clamp: unset"></p>
    <div class="votes" id="lbvotes"></div>
    <label for="lbnote" class="keys">Commentaire</label>
    <textarea id="lbnote" rows="4"></textarea>
    <div class="nav"><button id="lbprev">← Préc.</button><button id="lbclose">Fermer</button><button id="lbnext">Suiv. →</button></div>
    <p class="keys">Clavier : ← → naviguer, 1 garder, 2 peut-être, 3 non, Échap fermer.</p>
  </aside>
</div>

<script>
const VERDICTS = [["keep", "Garder"], ["maybe", "Peut-être"], ["no", "Non"]];
let rounds = [], round = null, filter = "all", picks = {}, db = null, lbIndex = -1, reveal = false;
const $ = (id) => document.getElementById(id);
const docId = (ref) => `${round.id}__${ref}`;
const pick = (ref) => picks[docId(ref)] || {};

function visibleItems() {
  return round.items.filter((it) => {
    const v = pick(it.ref).verdict;
    return filter === "all" || (filter === "todo" ? !v : v === filter);
  });
}

function setStatus(text) { $("status").textContent = text; }

function voteButtons(ref) {
  const box = document.createElement("div");
  box.className = "votes";
  for (const [v, label] of VERDICTS) {
    const b = document.createElement("button");
    b.dataset.v = v; b.textContent = label;
    b.setAttribute("aria-pressed", String(pick(ref).verdict === v));
    b.addEventListener("click", (e) => { e.stopPropagation(); vote(ref, v); });
    box.append(b);
  }
  return box;
}

function render() {
  if (!round) return;
  const bands = $("bands");
  bands.replaceChildren();
  const items = visibleItems();
  for (const g of round.groups) {
    const groupItems = items.filter((it) => it.group === g.id);
    if (!groupItems.length) continue;
    const sec = document.createElement("section");
    sec.className = "band";
    const head = document.createElement("div");
    head.className = "band-head";
    const letter = document.createElement("span"); letter.className = "letter"; letter.textContent = g.id;
    const h2 = document.createElement("h2"); h2.textContent = `${g.tier} · ${g.era}`;
    const p = document.createElement("p"); p.textContent = g.hint;
    head.append(letter, h2, p);
    sec.append(head);
    const byTier = new Map();
    for (const it of [...groupItems].sort((a, b) => (a.tier ?? 0) - (b.tier ?? 0))) {
      const key = Number.isFinite(it.tier) ? it.tier : null;
      if (!byTier.has(key)) byTier.set(key, []);
      byTier.get(key).push(it);
    }
    for (const [tier, list] of byTier) {
      if (tier !== null && byTier.size > 1) {
        const sub = document.createElement("h3"); sub.className = "subtier";
        sub.textContent = `Tier ${tier} · ${list.length} piste${list.length > 1 ? "s" : ""}`;
        sec.append(sub);
      }
      const grid = document.createElement("div"); grid.className = "grid";
      for (const it of list) grid.append(card(it));
      sec.append(grid);
    }
    bands.append(sec);
  }
  if (!bands.children.length) bands.innerHTML = '<p class="empty">Aucun concept pour ce filtre.</p>';
  renderSummary();
  updateChips();
}

function card(it) {
  const c = document.createElement("article");
  c.className = "card"; c.id = `card-${it.ref}`;
  if (pick(it.ref).verdict) c.dataset.v = pick(it.ref).verdict;
  const shot = document.createElement("button");
  shot.className = "shot"; shot.setAttribute("aria-label", `Agrandir ${it.ref}`);
  const img = document.createElement("img"); img.src = it.img; img.alt = `${it.ref} ${it.title}`; img.loading = "lazy";
  const ref = document.createElement("span"); ref.className = "ref"; ref.textContent = it.ref;
  shot.append(img, ref);
  if (Number.isFinite(it.tier)) { const tier = document.createElement("span"); tier.className = "tier"; tier.textContent = `T${it.tier}`; shot.append(tier); }
  if (reveal && it.predicted) { const p = document.createElement("span"); p.className = "pred"; p.textContent = "Prédit"; shot.append(p); }
  shot.addEventListener("click", () => openLb(it.ref));
  const body = document.createElement("div"); body.className = "body";
  const t = document.createElement("p"); t.className = "title"; t.textContent = it.title;
  const m = document.createElement("p"); m.className = "mech"; m.textContent = it.mechanism;
  const note = document.createElement("textarea");
  note.id = `note-${it.ref}`; note.placeholder = "Commentaire…"; note.rows = 1;
  note.value = pick(it.ref).note || "";
  note.addEventListener("input", () => queueNote(it.ref, note.value));
  body.append(t, m, voteButtons(it.ref), note);
  c.append(shot, body);
  return c;
}

function renderSummary() {
  const by = { keep: [], maybe: [], no: [] };
  for (const it of round.items) { const v = pick(it.ref).verdict; if (v) by[v].push(it.ref); }
  const seen = by.keep.length + by.maybe.length + by.no.length;
  const s = $("summary");
  s.replaceChildren();
  const add = (label, refs) => { const span = document.createElement("span"); span.innerHTML = `${label} : `; const b = document.createElement("b"); b.textContent = refs.length ? refs.join(", ") : "aucun"; span.append(b); s.append(span); };
  const prog = document.createElement("span"); prog.textContent = `${seen} / ${round.items.length} vus`; s.append(prog);
  add("Gardés", by.keep); add("Peut-être", by.maybe);
  const copy = document.createElement("button"); copy.className = "copy"; copy.textContent = "Copier la sélection";
  copy.addEventListener("click", async () => {
    const lines = round.items.filter((it) => pick(it.ref).verdict && pick(it.ref).verdict !== "no")
      .map((it) => `${it.ref} (${pick(it.ref).verdict === "keep" ? "garder" : "peut-être"})${pick(it.ref).note ? " : " + pick(it.ref).note : ""}`);
    try { await navigator.clipboard.writeText(lines.join("\n") || "rien de sélectionné"); copy.textContent = "Copié"; }
    catch { copy.textContent = "Copie refusée"; }
    setTimeout(() => (copy.textContent = "Copier la sélection"), 1500);
  });
  s.append(copy);
  const predicted = round.items.filter((it) => it.predicted);
  if (!predicted.length) return;
  const toggle = document.createElement("button"); toggle.className = "copy";
  toggle.textContent = reveal ? "Masquer mes prédictions" : "Révéler mes prédictions";
  toggle.addEventListener("click", () => { reveal = !reveal; render(); });
  s.append(toggle);
  if (!reveal) return;
  const picked = round.items.filter((it) => ["keep", "maybe"].includes(pick(it.ref).verdict));
  const hits = picked.filter((it) => it.predicted).length;
  const score = document.createElement("span");
  score.textContent = `Prédictions : ${hits} / ${predicted.length} prédits choisis, ${hits} / ${picked.length} de tes choix étaient prédits`;
  s.append(score);
}

function updateChips() {
  const count = (f) => round.items.filter((it) => { const v = pick(it.ref).verdict; return f === "all" || (f === "todo" ? !v : v === f); }).length;
  for (const b of document.querySelectorAll(".chip")) {
    const base = { all: "Tout", todo: "À voir", keep: "Gardés", maybe: "Peut-être" }[b.dataset.f];
    b.textContent = `${base} ${count(b.dataset.f)}`;
    b.setAttribute("aria-pressed", String(b.dataset.f === filter));
  }
}

const pending = new Map(), writing = new Set(), timers = new Map();
function queueWrite(ref, patch, delay) {
  const id = docId(ref);
  picks[id] = { ...pick(ref), ...patch, round: round.id, ref };
  pending.set(id, picks[id]);
  clearTimeout(timers.get(id));
  timers.set(id, setTimeout(() => flush(id), delay));
}
async function flush(id) {
  if (!db || writing.has(id) || !pending.has(id)) return;
  const body = pending.get(id); pending.delete(id); writing.add(id);
  setStatus("Enregistrement…");
  try { await db.doc(`picks/${id}`).set({ ...body, updatedAt: new Date().toISOString() }); setStatus("Enregistré"); }
  catch (e) { setStatus(e.code === "invalid_argument" ? "Lecture seule : tes choix ne sont pas enregistrés" : "Échec de l'enregistrement, réessaie"); }
  finally { writing.delete(id); if (pending.has(id)) flush(id); }
}
function vote(ref, v) {
  queueWrite(ref, { verdict: pick(ref).verdict === v ? null : v }, 0);
  const c = $(`card-${ref}`);
  if (c && filter === "all") {
    if (pick(ref).verdict) c.dataset.v = pick(ref).verdict; else delete c.dataset.v;
    c.querySelector(".votes").replaceWith(voteButtons(ref));
    renderSummary(); updateChips();
  } else render();
  if (lbIndex >= 0) fillLb();
}
function queueNote(ref, text) { queueWrite(ref, { note: text }, 700); }

function lbList() { return round.groups.flatMap((g) => visibleItems().filter((it) => it.group === g.id).sort((a, b) => (a.tier ?? 0) - (b.tier ?? 0))); }
function openLb(ref) { lbIndex = lbList().findIndex((it) => it.ref === ref); $("lb").hidden = false; fillLb(); }
function fillLb() {
  const it = lbList()[lbIndex]; if (!it) return closeLb();
  $("lbimg").src = it.gif || it.img; $("lbimg").alt = `${it.ref} ${it.title}`;
  $("lbref").textContent = it.ref; $("lbtitle").textContent = it.title; $("lbmech").textContent = it.mechanism;
  $("lbvotes").replaceWith(Object.assign(voteButtons(it.ref), { id: "lbvotes" }));
  if (document.activeElement !== $("lbnote")) $("lbnote").value = pick(it.ref).note || "";
}
function closeLb() { $("lb").hidden = true; lbIndex = -1; }
function step(d) { const n = lbList().length; if (!n) return; lbIndex = (lbIndex + d + n) % n; $("lbnote").blur(); fillLb(); }
$("lbprev").onclick = () => step(-1); $("lbnext").onclick = () => step(1); $("lbclose").onclick = closeLb;
$("lbnote").addEventListener("input", () => { const it = lbList()[lbIndex]; if (it) { queueNote(it.ref, $("lbnote").value); const n = $(`note-${it.ref}`); if (n) n.value = $("lbnote").value; } });
document.addEventListener("keydown", (e) => {
  if ($("lb").hidden || e.target.tagName === "TEXTAREA") { if (e.key === "Escape" && !$("lb").hidden) $("lbnote").blur(); return; }
  if (e.key === "Escape") closeLb();
  else if (e.key === "ArrowRight") step(1);
  else if (e.key === "ArrowLeft") step(-1);
  else if (["1", "2", "3"].includes(e.key)) { const it = lbList()[lbIndex]; if (it) vote(it.ref, VERDICTS[+e.key - 1][0]); }
});

for (const b of document.querySelectorAll(".chip")) b.addEventListener("click", () => { filter = b.dataset.f; render(); });
$("round").addEventListener("change", () => { round = rounds.find((r) => r.id === $("round").value); try { localStorage.setItem("round", round.id); } catch {} render(); });

async function boot() {
  try { rounds = await (await fetch("rounds.json")).json(); }
  catch { $("bands").innerHTML = '<p class="empty">Impossible de lire rounds.json.</p>'; return; }
  let saved = null; try { saved = localStorage.getItem("round"); } catch {}
  round = rounds.find((r) => r.id === saved) || rounds[0];
  for (const r of rounds) { const o = document.createElement("option"); o.value = r.id; o.textContent = `${r.label} (${r.items.length})`; $("round").append(o); }
  $("round").value = round.id;
  render();
  db = window.claude ? await window.claude.use("db") : null;
  if (!db) { setStatus("Choix non enregistrés dans cette vue"); return; }
  const timeout = setTimeout(() => setStatus("Choix enregistrés injoignables pour l'instant"), 10000);
  db.collection("picks").onSnapshot((snap) => {
    if (!snap.metadata.fromCache) { clearTimeout(timeout); setStatus("À jour"); }
    for (const d of snap.docs) if (!pending.has(d.id) && !writing.has(d.id)) picks[d.id] = d.data();
    const focused = document.activeElement?.tagName === "TEXTAREA";
    if (!focused) render(); else { renderSummary(); updateChips(); }
    if (lbIndex >= 0) fillLb();
  }, () => { clearTimeout(timeout); setStatus("Choix enregistrés indisponibles"); });
}
boot();
</script>
