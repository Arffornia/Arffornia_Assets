<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launcher continuity · title screen direction C</title>
<link rel="stylesheet" href="../base.css">
<style>
  /* Direction C: Launcher continuity. Same tokens as the current launcher (Montserrat, plum
     #261d31 / #09070a, orange #ff7300, lavender text), so leaving the launcher and landing in the
     game feels like one product. Swap the tokens when the launcher's DA changes. */
  :root { --plum: #261d31; --plum-deep: #09070a; --plum-line: #3d2f4e; --lav: #b3a7c2; --orange: #ff7300; --orange-deep: #e06500; --ok: #42d392; --ink: #fff; }
  .tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(9, 7, 10, .55) 0%, rgba(9, 7, 10, 0) 22%, rgba(9, 7, 10, 0) 60%, rgba(9, 7, 10, .85) 100%), linear-gradient(90deg, rgba(38, 29, 49, .55), rgba(38, 29, 49, 0) 50%); mix-blend-mode: normal; }
  .top { position: absolute; left: 64px; right: 64px; top: 48px; display: flex; align-items: center; justify-content: space-between; font-family: Montserrat, sans-serif; color: var(--ink); }
  .word { font: 800 40px Montserrat, sans-serif; letter-spacing: 6px; }
  .chip { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 999px; background: rgba(22, 0, 32, .82); border: 1px solid var(--plum-line); font: 500 19px Montserrat, sans-serif; color: var(--lav); }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(66, 211, 146, .18); }
  .me { display: flex; align-items: center; gap: 14px; font: 600 20px Montserrat, sans-serif; }
  .me span { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #7a5a3a, #4a3424); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .15); }
  .news { position: absolute; right: 64px; top: 150px; width: 420px; padding: 26px 28px; border-radius: 18px; background: rgba(38, 29, 49, .86); border: 1px solid var(--plum-line); color: var(--ink); font-family: Montserrat, sans-serif; animation: rise .7s cubic-bezier(.2, .8, .2, 1) .5s both; }
  .news h2 { font: 700 26px/1.25 Montserrat, sans-serif; margin: 0 0 10px; }
  .news p { font: 400 18px/1.5 Montserrat, sans-serif; color: var(--lav); margin: 0; }
  .news .when { font: 500 15px Montserrat, sans-serif; color: var(--orange); margin-bottom: 10px; }
  .dock { position: absolute; left: 50%; bottom: 72px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 26px; background: rgba(22, 0, 32, .82); border: 1px solid var(--plum-line); box-shadow: 0 20px 60px rgba(9, 7, 10, .6); animation: dock .8s cubic-bezier(.2, .8, .2, 1) .15s both; }
  @keyframes dock { from { opacity: 0; transform: translate(-50%, 40px); } }
  @keyframes rise { from { opacity: 0; transform: translateY(20px); } }
  .dock button { all: unset; white-space: nowrap; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 26px; border-radius: 16px; font: 600 21px Montserrat, sans-serif; color: var(--lav); }
  .dock button svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; }
  .dock .play { background: var(--orange); color: #fff; font-size: 24px; font-weight: 700; padding: 0 40px; height: 76px; box-shadow: 0 8px 30px rgba(255, 115, 0, .4); }
  .dock .play svg { fill: #fff; stroke: none; }
  .dock .sep { width: 1px; height: 40px; background: var(--plum-line); margin: 0 6px; }
  .dock button.focus { color: #fff; background: rgba(61, 47, 78, .7); }
  .progress { width: 760px; padding: 6px 12px; }
  .progress .row { display: flex; justify-content: space-between; font: 600 20px Montserrat, sans-serif; color: #fff; margin-bottom: 14px; }
  .progress .row span:last-child { color: var(--lav); font-weight: 500; }
  .progress .track { height: 10px; border-radius: 6px; background: var(--plum); overflow: hidden; }
  .progress .fill { height: 100%; width: calc(var(--pp, .65) * 100%); background: linear-gradient(90deg, var(--orange-deep), var(--orange)); border-radius: 6px; }
  .foot { position: absolute; bottom: 26px; font: 500 15px Montserrat, sans-serif; color: rgba(179, 167, 194, .7); }
</style>
</head>
<body>
<div class="stage">
  <img id="bg" alt="">
  <div class="tint"></div>
  <div class="top">
    <div class="word">ARFFORNIA</div>
    <div class="chip only-title"><i></i><span><b>12 players</b> on Arffornia</span></div>
    <div class="me only-title"><span></span>TheGostsniper</div>
  </div>
  <article class="news only-title"><div class="when">Friday, 20:00</div><h2>Season 2 opens with the Space Elevator</h2><p>Deliver the tier 3 milestone together to unlock orbital logistics.</p></article>
  <nav class="dock only-title">
    <button class="play"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>Play on Arffornia</button>
    <span class="sep"></span>
    <button class="focus"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>Singleplayer</button>
    <button><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><path d="M16.5 13v7M13 16.5h7"/></svg>Mods</button>
    <button><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Options</button>
    <button aria-label="Quit game"><svg viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg></button>
  </nav>
  <div class="dock only-loading"><div class="progress"><div class="row"><span id="ph">Loading mods</span><span id="ct"></span></div><div class="track"><div class="fill"></div></div></div></div>
  <div class="foot" style="left:64px">Arffornia 5.2, NeoForge 21.1.172</div>
  <div class="foot" style="right:64px">Copyright Mojang AB. Do not distribute!</div>
</div>
<script src="../runtime.js"></script>
<script>
  if (document.documentElement.dataset.mode === 'loading') {
    window.onFrame = (t) => { const p = Math.min(1, window.UI.progress * Math.min(1, 0.4 + t / 6)); document.documentElement.style.setProperty('--pp', p);
      document.getElementById('ct').textContent = `${Math.round(p * 331)} of 331 mods`; };
    window.onFrame(0);
  }
</script>
</body>
</html>
