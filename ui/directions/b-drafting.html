<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drafting sheet · title screen direction B</title>
<link rel="stylesheet" href="../base.css">
<style>
  /* Direction B: Drafting sheet. The screen is an engineering drawing of the factory: thin leader
     lines name the machines, and the menu is the drawing's title block in the bottom-right corner. */
  :root { --line: rgba(214, 236, 242, .62); --ink: #eaf3f6; --muted: #9fb4be; --cell: rgba(9, 15, 19, .72); --hot: #e0703c; --teal: #2fd1c1; }
  .frame { position: absolute; inset: 28px; border: 1px solid var(--line); pointer-events: none; }
  .frame::after { content: ''; position: absolute; inset: 8px; border: 1px solid rgba(214, 236, 242, .22); }
  svg.notes { position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: visible; }
  svg.notes path { fill: none; stroke: var(--line); stroke-width: 1.4; }
  svg.notes .draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw .9s cubic-bezier(.4, 0, .2, 1) forwards; animation-delay: calc(var(--i) * 180ms + 300ms); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  svg.notes circle { fill: var(--ink); }
  .note { position: absolute; color: var(--ink); font: 500 24px/1.05 'Barlow Condensed', sans-serif; white-space: nowrap; animation: fade .5s ease both; animation-delay: calc(var(--i) * 180ms + 900ms); }
  .note small { display: block; font: 400 18px Barlow, sans-serif; color: var(--muted); margin-top: 3px; }
  @keyframes fade { from { opacity: 0; } }
  .dim { position: absolute; color: var(--muted); font: 400 18px 'Barlow Condensed', sans-serif; }

  .block { position: absolute; right: 36px; bottom: 36px; width: 760px; display: grid; grid-template-columns: repeat(4, 1fr); border-left: 1px solid var(--line); border-top: 1px solid var(--line); background: var(--cell); backdrop-filter: blur(8px); color: var(--ink); font-family: Barlow, sans-serif;
    animation: fade .6s ease both .2s; }
  .block > * { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 18px; min-height: 30px; }
  .block .k { display: block; font: 400 14px 'Barlow Condensed', sans-serif; color: var(--muted); letter-spacing: .4px; margin-bottom: 4px; }
  .block .name { grid-column: span 3; font: 600 54px/1 'Barlow Condensed', sans-serif; letter-spacing: .5px; padding-top: 18px; }
  .block .sheet { font: 500 22px 'Barlow Condensed', sans-serif; }
  .block button { all: unset; cursor: pointer; font: 500 26px 'Barlow Condensed', sans-serif; color: var(--ink); }
  .block .play { grid-column: span 4; display: flex; justify-content: space-between; align-items: center; background: var(--hot); color: #1d0e06; font: 600 40px 'Barlow Condensed', sans-serif; padding: 18px 22px; outline: 2px solid #ffd2b0; outline-offset: -6px; }
  .block .play small { font: 500 20px Barlow, sans-serif; color: rgba(29, 14, 6, .8); }
  .block .meta { font: 400 17px 'Barlow Condensed', sans-serif; color: var(--muted); }
  .rev { grid-column: span 4; padding: 0 !important; }
  .rev table { width: 100%; border-collapse: collapse; font: 400 20px 'Barlow Condensed', sans-serif; }
  .rev td { border-bottom: 1px solid rgba(214, 236, 242, .2); padding: 9px 18px; }
  .rev td:last-child { text-align: right; color: var(--muted); width: 120px; }
  .rev tr.done td:first-child::before { content: ''; display: inline-block; width: 10px; height: 10px; background: var(--teal); margin-right: 12px; }
  .rev tr.now td { color: #fff; } .rev tr.now td:first-child::before { content: ''; display: inline-block; width: 10px; height: 10px; border: 2px solid var(--hot); margin-right: 10px; }
  .rev tr.todo td { color: rgba(234, 243, 246, .45); } .rev tr.todo td:first-child::before { content: ''; display: inline-block; width: 10px; height: 10px; border: 1px solid rgba(234, 243, 246, .45); margin-right: 11px; }
  .bar { grid-column: span 4; position: relative; height: 18px; padding: 16px 18px !important; }
  .bar i { position: absolute; left: 18px; right: 18px; top: 24px; height: 2px; background: rgba(214, 236, 242, .25); }
  .bar b { position: absolute; left: 18px; top: 19px; height: 12px; width: calc((100% - 36px) * var(--pp, .65)); border-left: 2px solid var(--hot); border-right: 2px solid var(--hot); }
  .bar b::after { content: ''; position: absolute; left: 0; right: 0; top: 5px; height: 2px; background: var(--hot); }
  .foot { position: absolute; left: 60px; bottom: 50px; font: 400 16px Barlow, sans-serif; color: rgba(234, 243, 246, .55); }
</style>
</head>
<body>
<div class="stage">
  <img id="bg" alt="">
  <div class="frame"></div>
  <svg class="notes" id="notes"></svg>
  <div id="labels"></div>
  <div class="block only-title">
    <div class="name">ARFFORNIA</div><div class="sheet"><span class="k">Sheet</span>Title</div>
    <button class="play">Play on Arffornia <small>12 players online</small></button>
    <div><button>Singleplayer</button></div><div><button>Mods</button></div><div><button>Options</button></div><div><button>Quit</button></div>
    <div class="meta"><span class="k">Scale</span>1 block = 16 px</div><div class="meta"><span class="k">Revision</span>5.2</div><div class="meta"><span class="k">Platform</span>NeoForge 21.1</div><div class="meta"><span class="k">Milestone</span>3 of 8</div>
  </div>
  <div class="block only-loading">
    <div class="name">ARFFORNIA</div><div class="sheet"><span class="k">Sheet</span>Loading</div>
    <div class="rev"><table id="rev"></table></div>
    <div class="bar"><i></i><b></b></div>
  </div>
  <div class="foot">Copyright Mojang AB. Do not distribute!</div>
</div>
<script src="../runtime.js"></script>
<script>
  // Projection of the factory-line scene's "title" camera (orthographic, true isometric): three.js axes [x, height, y].
  // scene camera 'menu-left' (scenes/factory-line.json)
  const CAM = { target: [13.5, 2.2, 1.2], height: 19, offset: [-6.2, 0.4] }, SW = 1920, SH = 1080;
  const proj = ([x, y, z]) => { const d = [x - CAM.target[0], y - CAM.target[1], z - CAM.target[2]]; const W = CAM.height * SW / SH;
    const rx = (d[0] - d[2]) * Math.SQRT1_2, uy = d[1] * 0.8165 - (d[0] + d[2]) * 0.4082;
    return [((rx + W / 2 + CAM.offset[0]) / W) * SW, ((CAM.height / 2 - CAM.offset[1] - uy) / CAM.height) * SH]; };
  // anchor (machine top centre), label offset in px
  const notes = [
    ['Smelter', 'Tier 0, ore into ingots', [6.5, 3.1, 3.5], [60, -150]],
    ['Constructor', 'Tier 1, plates and rods', [11.5, 2.4, 3.5], [-120, 190]],
    ['Foundry', 'Tier 2, alloys', [12.7, 2.8, -1.4], [90, -150]],
    ['Assembler', 'Tier 2, reinforced plates', [17.0, 2.2, 4.0], [-260, 170]],
    ['Space Elevator', 'Tier 3, milestone deliveries', [24.0, 9.2, 3.5], [70, -40]],
  ];
  const svg = document.getElementById('notes'), labels = document.getElementById('labels');
  notes.forEach(([n, sub, p, off], i) => {
    const [x, y] = proj(p), lx = x + off[0], ly = y + off[1];
    const ex = lx + (off[0] < 0 ? 0 : 0);
    svg.insertAdjacentHTML('beforeend', `<path class="draw" style="--i:${i}" d="M${x} ${y}L${ex} ${ly}h${off[0] < 0 ? -18 : 18}"/><circle cx="${x}" cy="${y}" r="4"/>`);
    const el = document.createElement('div'); el.className = 'note'; el.style.setProperty('--i', i);
    el.innerHTML = `${n}<small>${sub}</small>`;
    el.style.top = `${ly - 30}px`; if (off[0] < 0) { el.style.right = `${SW - (ex - 24)}px`; el.style.textAlign = 'right'; } else el.style.left = `${ex + 24}px`;
    labels.appendChild(el);
  });
  // a dimension line along the main slab: the line is 28 blocks long
  const a = proj([-1.2, 0, 6.6]), b = proj([27, 0, 6.6]);
  svg.insertAdjacentHTML('beforeend', `<path class="draw" style="--i:6" d="M${a[0]} ${a[1] + 30}L${b[0]} ${b[1] + 30}M${a[0]} ${a[1] + 18}l0 24M${b[0]} ${b[1] + 18}l0 24"/>`);
  const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2 + 30];
  labels.insertAdjacentHTML('beforeend', `<div class="dim note" style="--i:6;left:${mid[0] - 30}px;top:${mid[1] + 6}px;transform:rotate(${Math.atan2(b[1] - a[1], b[0] - a[0])}rad)">28 blocks</div>`);
  if (document.documentElement.dataset.mode === 'loading') {
    const phases = [['Discover mods', '331'], ['Load mods', ''], ['Build registries', ''], ['Bake models', ''], ['Open title screen', '']];
    const rev = document.getElementById('rev');
    window.onFrame = (t) => { const p = Math.min(1, window.UI.progress * Math.min(1, 0.4 + t / 6)); const cur = Math.min(4, Math.floor(p * 4)) ;
      rev.innerHTML = phases.map(([n, v], i) => `<tr class="${i < cur ? 'done' : i === cur ? 'now' : 'todo'}"><td>${n}</td><td>${i === 1 ? `${Math.round(Math.min(1, p / 0.5) * 331)} / 331` : i < cur ? 'done' : v}</td></tr>`).join('');
      document.documentElement.style.setProperty('--pp', p); };
    window.onFrame(0);
  }
</script>
</body>
</html>
